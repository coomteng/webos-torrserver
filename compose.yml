# TorrServer with torr-remote compiled in, as deployed on the LAN box (Portainer stack "torrserver").
# The fork image (github.com/coomteng/TorrServer) serves TorrServer and, under /tr, the TV app
# (/tr/tv/), the phone page (/tr/r/<id>), external subtitles and background pre-cache: one
# container, one port. Build the TV app with SIDECAR_BASE=http://<host>:8090/tr.
# To run stock TorrServer plus the standalone sidecar instead, see the "torr-remote" service in
# git history before 2026-11-08 (image ghcr.io/coomteng/webos-torrserver, port 8791).
services:
  torrserver:
    image: ghcr.io/coomteng/torrserver:master
    container_name: torrserver
    restart: unless-stopped
    network_mode: host              # BT peers + DLNA/UPnP work best without NAT; web UI/API/TV app on :8090
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TZ: ${TZ:-Europe/Zurich}
      ASSRT_TOKEN: ${ASSRT_TOKEN:-}                            # assrt.net token enables subtitle search
    volumes:
      - ${TORR_CONFIG:-./data/config}:/opt/ts/config
      - ${TORR_DATA:-./data/torr-remote}:/opt/ts/config/torr-remote   # subs/ + precache.json
      - ${TORR_CACHE:-./data/cache}:/opt/ts/torrents           # disk cache (settings: UseDisk + TorrentsSavePath=/opt/ts/torrents)
    mem_limit: ${TORR_MEM:-768m}
